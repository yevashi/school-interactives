<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лаборатория превращений • 5 класс</title>
<style>
:root{--ink:#14334c;--muted:#607589;--navy:#163c57;--blue:#246bd4;--sky:#e6f3ff;--mint:#dbf8ec;--orange:#f68039;--peach:#fff0df;--border:#cfe0ed;--bg:#edf5f9;--white:#fff;--shadow:0 16px 38px rgba(32,61,83,.10)}*{box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(145deg,#dfeffd 0%,#f7fbff 47%,#e6f8ef 100%);color:var(--ink);margin:0;min-height:100vh}.layout{width:min(1380px,96vw);margin:0 auto;padding:18px 0 32px}.topbar{background:rgba(255,255,255,.95);border:1px solid #d5e5ef;border-radius:22px;padding:14px 20px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(17px,2vw,24px);font-weight:850;letter-spacing:-.6px;display:flex;gap:11px;align-items:center}.brand .labicon{background:#dff4ff;border-radius:13px;padding:8px}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.chip{background:#edf6ff;padding:9px 13px;border-radius:13px;font-weight:700;color:#315c85}.chip.score{background:#dff8ee;color:#12694d}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.nav button{border:1px solid #c8dce8;border-radius:12px;background:#fff;color:#34506a;padding:11px 16px;cursor:pointer;font-size:14px;font-weight:800}.nav button.active{background:#19548c;color:#fff;border-color:#19548c;box-shadow:0 6px 16px #135ca22b}.nav button.done:before{content:'✓ ';color:#16b67d}.nav button.active.done:before{color:white}.pane{background:rgba(255,255,255,.95);border:1px solid #dae7ef;border-radius:26px;box-shadow:var(--shadow);padding:clamp(20px,2.5vw,35px);min-height:560px;animation:rise .22s ease}@keyframes rise{from{opacity:.55;transform:translateY(10px)}to{opacity:1;transform:none}}h1{font-size:clamp(30px,4vw,54px);line-height:1.10;margin:8px 0 16px;letter-spacing:-1.1px}h2{font-size:clamp(22px,2.8vw,38px);line-height:1.12;margin:8px 0 15px;letter-spacing:-.6px}h3{margin:0 0 9px;font-size:22px}.subtitle{font-size:clamp(16px,1.4vw,20px);line-height:1.52;color:#4a6781;max-width:910px}.eyebrow{display:inline-flex;background:#e8f3ff;color:#25629c;font-weight:900;border-radius:10px;padding:8px 12px;letter-spacing:1px;font-size:13px}.introgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:27px 0}.samplebox{border-radius:20px;padding:23px;background:#edf8ff;border:2px solid #cce6fa}.samplebox.hot{background:#fff5ea;border-color:#ffddbe}.sampleicon{font-size:62px;line-height:1.1}.samplebox strong{font-size:23px;display:block;margin:12px 0 6px}.samplebox p{font-size:17px;margin:0;color:#587084}.btn{background:#2061ba;border:0;color:#fff;border-radius:14px;padding:14px 21px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .12s,filter .12s}.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#eaf3fb;color:#235580;border:1px solid #bfd7ea}.btn.orange{background:#f07b39}.btn.green{background:#128660}.btn.ghost{background:transparent;border:1px solid #ccdfe9;color:#3b6585}.btn.sm{padding:10px 13px;font-size:14px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:23px}.rulegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.rule{border-radius:20px;padding:24px;min-height:240px;border:2px solid #bbd9f9;background:#eef7ff}.rule.chem{background:#fff5ec;border-color:#ffceab}.rule .em{font-size:50px}.rule strong{font-size:27px;display:block;margin:8px 0}.rule p{font-size:19px;line-height:1.47}.warning{border:1px solid #ffda8c;background:#fff9e9;border-radius:16px;padding:18px;font-size:19px;line-height:1.45;margin-top:16px}.warning strong{color:#89521c}.stationhead{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.stationtitle{color:#51748a;font-weight:800;font-size:15px;letter-spacing:.7px;text-transform:uppercase}.miniprogress{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 22px}.dot{width:38px;height:10px;border-radius:30px;background:#dfe9f1}.dot.active{background:#2485cf}.dot.ok{background:#35bb88}.dot.bad{background:#f2a867}.experimentgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}.experimentview{position:relative;background:#f2f8fd;border:2px solid #d6e6f2;border-radius:22px;overflow:hidden;min-height:250px}.experimentview.after{background:#fcf7ef;border-color:#f5dec3}.scenehead{position:absolute;z-index:2;top:14px;left:16px;font-size:14px;font-weight:850;background:#fffaf2e8;padding:7px 10px;border-radius:9px;color:#45627a}.experimentview svg{width:100%;height:250px;display:block}.experimentview.locked svg{filter:grayscale(.9) blur(8px);opacity:.22}.lockmessage{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:21px;font-weight:800;color:#657e8e;padding:35px}.experimentview.animate svg{animation:pop .5s cubic-bezier(.17,.67,.25,1.25)}@keyframes pop{from{transform:scale(.94);opacity:.3}to{transform:scale(1);opacity:1}}.questionbar{background:#f2f8fd;border-radius:16px;padding:17px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.questionbar b{font-size:19px}.choicearea{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 8px}.choice{flex:1;min-width:220px;max-width:500px;font-size:22px;padding:20px 14px;border-radius:18px;background:#e6f3ff;border:2px solid #a6d2f8;color:#154f89;font-weight:900;cursor:pointer}.choice.chem{background:#fff0e4;border-color:#f6bd92;color:#a85421}.choice:disabled{cursor:not-allowed;opacity:.58}.feedback{border-radius:15px;margin-top:16px;padding:17px;font-size:19px;line-height:1.55}.feedback.correct{background:#dff7eb;border:1px solid #a6e7cb;color:#145a45}.feedback.incorrect{background:#fff0dd;border:1px solid #ffc88e;color:#8c501a}.answerkey{font-size:17px;line-height:1.48;color:#4a687c;margin-top:6px}.explain{display:block;margin-top:4px}.bottomnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}.summarygrid{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start}.resultcircle{width:250px;height:250px;border-radius:50%;border:13px solid #b8e8ce;background:#e5f9ef;display:grid;place-items:center;text-align:center}.resultcircle strong{font-size:76px;line-height:1;color:#147c57}.resultcircle span{font-size:18px;color:#337a66}.summarytable{border-collapse:collapse;width:100%;font-size:16px}.summarytable td,.summarytable th{padding:11px 13px;border-bottom:1px solid #dae8ef;text-align:left}.summarytable th{background:#eaf4fa;color:#366184}.tag{display:inline-flex;border-radius:50px;padding:5px 10px;font-size:13px;font-weight:900}.tag.phys{background:#dff0ff;color:#2065a0}.tag.chem{background:#fff0de;color:#a65a20}.notice{color:#577083;font-size:14px;margin-top:19px}.leader{font-size:20px;font-weight:750;margin-top:16px}.footer{padding:15px 20px;color:#638296;font-size:13px;text-align:center}.smallguide{background:#f3f9fd;border-left:5px solid #74b4e0;border-radius:10px;padding:12px 17px;font-size:16px;color:#355b73;margin-top:13px}.hidden{display:none!important}.startnote{font-size:15px;color:#66808f;margin-top:15px}.teacherpoint{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.teacherpoint span{border:1px solid #dce7ef;background:#f5fafd;border-radius:10px;padding:8px 11px;color:#496c7f;font-size:14px}.diagramnote{font-size:17px;padding:15px;border-radius:13px;background:#f5f9fc}.canvasframe{background:linear-gradient(#f7fcff,#e7f4fc)}
@media(max-width:750px){.introgrid,.rulegrid,.experimentgrid,.summarygrid{grid-template-columns:1fr}.experimentview svg{height:210px}.pane{min-height:auto;padding:20px}.topbar{padding:12px}.nav button{font-size:12px;padding:10px}.choice{font-size:19px}.resultcircle{width:195px;height:195px}.resultcircle strong{font-size:60px}}
@media print{body{background:#fff}.topbar,.nav,.actions,.bottomnav{display:none!important}.pane{border:0;box-shadow:none}.layout{width:100%}}
</style>
</head>
<body>
<div class="layout"><header class="topbar"><div class="brand"><span class="labicon">🔬</span><span>Лаборатория превращений</span></div><div class="meta"><span class="chip">Естествознание · 5 класс</span><span class="chip">13.11.2026</span><span class="chip score" id="scoreTop">🧪 0 / 10</span><button class="btn ghost sm" onclick="toggleFullscreen()" title="На весь экран">⛶ Экран</button></div></header><nav class="nav" id="nav"></nav><main id="app" class="pane"></main><footer class="footer">Работает без интернета · Только безопасные цифровые модели · Стрелки ← → переключают опыты, клавиши 1 и 2 выбирают ответ после наблюдения</footer></div>
<script>
'use strict';
const experiments=[
{id:1,station:1,title:'Лёд превращается в воду',question:'Появилось ли новое вещество?',before:'ice',after:'water',kind:'p',observation:'Лёд растаял, появилась жидкая вода.',reason:'Лёд и вода — одно и то же вещество H₂O. Изменилось только его состояние.'},
{id:2,station:1,title:'Бумагу разорвали',question:'Из чего теперь состоят кусочки?',before:'paper',after:'torn',kind:'p',observation:'Вместо целого листа получились кусочки.',reason:'Материал остался бумагой. Изменились форма и размер, но не состав вещества.'},
{id:3,station:1,title:'Яйцо сварили',question:'Можно ли считать это простым изменением формы?',before:'egg',after:'cooked',kind:'c',observation:'Белок из прозрачного и жидкого стал белым и плотным.',reason:'При нагревании происходят химические изменения белков: они меняют свою структуру и свойства.'},
{id:4,station:1,title:'Сахар растворили в воде',question:'Появилось ли новое вещество?',before:'sugar',after:'dissolved',kind:'p',observation:'Кристаллы сахара исчезли из виду, вода стала сладкой.',reason:'Молекулы сахара распределились в воде и остались молекулами сахара.'},
{id:5,station:2,title:'Сода встретилась с уксусом',question:'Почему возникли пузырьки?',before:'soda',after:'fizz',kind:'c',observation:'Смесь зашипела, образовались пузырьки газа.',reason:'Сода реагирует с уксусной кислотой, образуются новые вещества, включая углекислый газ.'},
{id:6,station:2,title:'Вода закипела',question:'Пузырьки — обязательно химическая реакция?',before:'heat',after:'boil',kind:'p',observation:'В воде поднялись пузырьки и появился пар.',reason:'Это водяной пар: вещество остаётся водой H₂O. Пузырьки сами по себе не доказывают химическую реакцию.'},
{id:7,station:2,title:'Гвоздь покрылся ржавчиной',question:'Это только изменение цвета?',before:'nail',after:'rust',kind:'c',observation:'На металлической поверхности появился бурый слой.',reason:'Железо взаимодействует с кислородом и влагой: образуются новые соединения железа — ржавчина.'},
{id:8,station:2,title:'Краситель смешали с водой',question:'Стал ли краситель новым веществом?',before:'dye',after:'color',kind:'p',observation:'Окраска распространилась по всей воде.',reason:'Частицы пищевого красителя распределились в воде. В этой модели химическая реакция не происходит.'},
{id:9,station:3,title:'Свеча горит',question:'Что происходит с парами воска в пламени?',before:'unlit',after:'burn',kind:'c',observation:'У свечи появилось пламя, выделяются тепло и свет.',reason:'Пары воска реагируют с кислородом. При горении образуются новые вещества, в том числе углекислый газ и вода.'},
{id:10,station:3,title:'Воск свечи плавится',question:'Новый ли это материал?',before:'wax',after:'melt',kind:'p',observation:'Твёрдый воск у фитиля стал жидким.',reason:'Это тот же воск, только в жидком состоянии. Плавление — физическое явление.'}
];
let page='start',selected=0,observed={},answers={},showKey=false;
const pages=[['start','🏁 Старт'],['rule','📚 Главное правило'],['s1','🧊 Станция 1'],['s2','🫧 Станция 2'],['s3','🕯️ Станция 3'],['finish','🏆 Итоги']];
const $=id=>document.getElementById(id);
function score(){return Object.values(answers).filter(x=>x.correct).length}function answered(){return Object.keys(answers).length}
function go(pg){page=pg;if(/^s\d$/.test(pg)){let station=Number(pg[1]);if(experiments[selected].station!==station)selected=experiments.findIndex(x=>x.station===station)}render()}
function render(){
 $('scoreTop').textContent=`🧪 ${score()} / 10`;
 $('nav').innerHTML=pages.map(([p,label])=>`<button class="${page===p?'active':''} ${('s'+('123'.indexOf(p.slice(-1))+1)===p && ['s1','s2','s3'].includes(p) && experiments.filter(x=>x.station===Number(p.slice(-1))).every(x=>answers[x.id]))?'done':''}" onclick="go('${p}')">${label}</button>`).join('');
 $('app').innerHTML=page==='start'?startHtml():page==='rule'?ruleHtml():page==='finish'?finishHtml():labHtml();
}
function startHtml(){return `<span class="eyebrow">МИССИЯ · 40-МИНУТНЫЙ УРОК</span><h1>Физические и химические<br>явления</h1><p class="subtitle">В каждом опыте что-то меняется. Но <b>когда появляется новое вещество</b>, а когда вещество остаётся тем же? Сегодня ты — исследователь, который докажет ответ.</p>
<div class="introgrid"><div class="samplebox"><div class="sampleicon">🧊 → 💧</div><strong>Лёд растаял</strong><p>Был лёд. Стала вода. Что произошло с веществом?</p></div><div class="samplebox hot"><div class="sampleicon">🕯️ → 🔥</div><strong>Свеча загорелась</strong><p>Появилось пламя. Что происходит при горении?</p></div></div>
<div class="questionbar"><b>Вопрос урока: что важнее — внешний вид или появление нового вещества?</b><span class="tag phys">Цель 5.3.1.4</span></div>
<div class="actions"><button class="btn" onclick="go('rule')">Узнать главное правило →</button><button class="btn secondary" onclick="go('s1')">Сразу к опытам</button></div><div class="startnote">Состоит из 10 виртуальных опытов и итоговой проверки. Никакие реактивы и подключение к интернету не требуются.</div>`}
function ruleHtml(){return `<span class="eyebrow">КАК МЫ ОПРЕДЕЛЯЕМ ВИД ЯВЛЕНИЯ?</span><h2>Главный вопрос: появилось ли новое вещество?</h2><div class="rulegrid"><div class="rule"><div class="em">🧊 💧 📄</div><strong>Физическое явление</strong><p>Новое вещество <b>не образуется</b>. Меняются форма, размер, состояние или распределение частиц.</p><span class="tag phys">То же вещество</span></div><div class="rule chem"><div class="em">🔥 🥚 🟤</div><strong>Химическое явление</strong><p>В результате изменения <b>образуются новые вещества</b> с другими свойствами.</p><span class="tag chem">Новое вещество</span></div></div>
<div class="warning"><strong>⚠️ Ловушка для исследователя!</strong> Пузырьки, изменение цвета и выделение тепла могут быть признаками химического процесса, но не всегда. Например, при кипении воды пузырьки — это пар. Всегда спрашивай: <b>«Есть ли новое вещество?»</b></div>
<div class="smallguide"><b>Запись в тетради:</b> физическое = новых веществ нет; химическое = образуются новые вещества. Во время опытов записывайте номер, Ф/Х и причину.</div><div class="actions"><button class="btn" onclick="go('s1')">Начать исследования →</button><button class="btn secondary" onclick="go('start')">← На старт</button></div>`}
function getStation(x){return x.station===1?'СТАНЦИЯ 1 · ПЕРВЫЕ ПРЕВРАЩЕНИЯ':x.station===2?'СТАНЦИЯ 2 · УЛИКИ И ОБМАНКИ':'СТАНЦИЯ 3 · ТАЙНА СВЕЧИ'}
function labHtml(){let x=experiments[selected],isSeen=!!observed[x.id],ans=answers[x.id];let st=experiments.filter(e=>e.station===x.station),k=st.indexOf(x);
return `<div class="stationhead"><div><div class="stationtitle">${getStation(x)}</div><h2>${x.id}. ${x.title}</h2></div><span class="chip">Опыт ${x.id} из 10 · ${k+1}/${st.length} на станции</span></div>
<div class="miniprogress">${experiments.map(e=>`<span title="Опыт ${e.id}" class="dot ${e.id===x.id?'active':answers[e.id]?(answers[e.id].correct?'ok':'bad'):''}"></span>`).join('')}</div>
<div class="experimentgrid"><section class="experimentview canvasframe"><div class="scenehead">ДО · наблюдаем исходное состояние</div>${draw(x.before)}</section><section class="experimentview after ${isSeen?'animate':'locked'}"><div class="scenehead">ПОСЛЕ · результат опыта</div>${draw(x.after)}${!isSeen?'<div class="lockmessage">🔒<br>Нажми «Запустить опыт»</div>':''}</section></div>
<div class="questionbar"><b>🔍 ${x.question}</b><span class="tag ${x.kind==='p'?'phys':'chem'}">Найди доказательство</span></div>
${!isSeen?`<div class="actions"><button class="btn orange" onclick="observe(${x.id})">▶ Запустить опыт</button><span class="answerkey">Сначала предскажи результат, потом наблюдай!</span></div>`:`<div class="diagramnote"><b>Наблюдение:</b> ${x.observation}</div><div class="choicearea"><button class="choice" ${ans?'disabled':''} onclick="choose('p')">💧 ФИЗИЧЕСКОЕ</button><button class="choice chem" ${ans?'disabled':''} onclick="choose('c')">🔥 ХИМИЧЕСКОЕ</button></div>`}
${ans?`<div class="feedback ${ans.correct?'correct':'incorrect'}"><strong>${ans.correct?'✅ Верно! +1 балл':'💡 Проверь рассуждение. Балл за этот опыт не начислен.'}</strong><span class="explain"><b>Правильный ответ:</b> ${x.kind==='p'?'физическое':'химическое'} явление. ${x.reason}</span></div>`:''}
<div class="bottomnav"><button class="btn secondary" onclick="prev()">← Предыдущий опыт</button><div class="teacherpoint"><span>Вывод по схеме</span><span>1 ученик отвечает у доски</span><span>остальные — в тетради</span></div><button class="btn ${ans?'green':'secondary'}" onclick="next()">${x.id===10?'К итогам →':'Следующий опыт →'}</button></div>`}
function observe(id){observed[id]=true;render()}
function choose(value){let x=experiments[selected];if(!observed[x.id]||answers[x.id])return;answers[x.id]={value,correct:value===x.kind};render()}
function next(){if(selected<9){selected++;page='s'+experiments[selected].station;render()}else go('finish')}
function prev(){if(selected>0){selected--;page='s'+experiments[selected].station;render()}else go('rule')}
function finishHtml(){let pts=score(),n=answered(),grade=n<10?'Остались неопробованные задания':pts>=9?'Отличная работа исследователей!':pts>=7?'Хороший результат — проверьте ловушки.':'Главный критерий стоит повторить.';return `<span class="eyebrow">ПОДВОДИМ ИТОГИ</span><h2>Результат лаборатории</h2><div class="summarygrid"><div><div class="resultcircle"><div><strong>${pts}</strong><span>из 10 баллов</span></div></div><div class="leader">${grade}</div><p class="subtitle" style="font-size:16px">Вы ответили на ${n} из 10 заданий. За каждый правильный первый ответ — 1 балл.</p></div><div><h3>Три вывода настоящего исследователя</h3><div class="rule" style="min-height:0;padding:17px;margin-bottom:12px"><b>1.</b> Меняются форма и состояние — это может быть физическое явление, если новое вещество не образовалось.</div><div class="rule chem" style="min-height:0;padding:17px;margin-bottom:12px"><b>2.</b> При химическом явлении образуются новые вещества.</div><div class="warning" style="font-size:17px;margin:0"><b>3.</b> Нельзя судить только по пузырькам или цвету. Свеча — особый пример: плавление воска физическое, горение химическое.</div></div></div>
<div class="actions"><button class="btn" onclick="showKey=!showKey;render()">${showKey?'Скрыть разбор':'Показать разбор всех 10 опытов'}</button><button class="btn secondary" onclick="go('s1')">↶ Вернуться к опытам</button><button class="btn ghost" onclick="restart()">Начать заново для другого класса</button></div>
${showKey?`<div style="overflow-x:auto;margin-top:20px"><table class="summarytable"><thead><tr><th>№</th><th>Опыт</th><th>Вид явления</th><th>Почему?</th></tr></thead><tbody>${experiments.map(x=>`<tr><td>${x.id}</td><td>${x.title}</td><td><span class="tag ${x.kind==='p'?'phys':'chem'}">${x.kind==='p'?'Физ.':'Хим.'}</span></td><td>${x.reason}</td></tr>`).join('')}</tbody></table></div>`:''}
<div class="smallguide" style="margin-top:20px"><b>В тетрадь:</b> «Главное различие физического и химического явления — <u>образование новых веществ</u>». <b>Домашнее задание:</b> найти дома три примера и объяснить каждый. Опытов с огнём и реактивами не проводить.</div>`}
function restart(){if(confirm('Очистить ответы и начать лабораторию заново?')){answers={};observed={};selected=0;showKey=false;go('start')}}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else document.exitFullscreen?.()}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&/^s\d$/.test(page))next();if(e.key==='ArrowLeft'&&/^s\d$/.test(page))prev();if(/^s\d$/.test(page)&&observed[experiments[selected].id]&&!answers[experiments[selected].id]){if(e.key==='1')choose('p');if(e.key==='2')choose('c')}});
// SVG scenes: self-contained hand-drawn diagrams, no remote resources.
const svgWrap=(inner)=>`<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="460" height="260" fill="#edf8ff"/><path d="M0 215H460" stroke="#cee3f0" stroke-width="3"/><ellipse cx="230" cy="226" rx="125" ry="14" fill="#b4d5e7" opacity=".45"/>${inner}</svg>`;
const cup=(liquid='#a8dfff',height=52,content='')=>`<path d="M156 58L165 199Q167 216 181 216H281Q294 216 296 199L304 58" fill="#fcffffaa" stroke="#588fae" stroke-width="6" stroke-linejoin="round"/><path d="M171 ${199-height}H290L284 202Q280 207 274 207H187Q177 207 175 198Z" fill="${liquid}" opacity=".9"/>${content}`;
const candle=(flame=false,melting=false)=>`<ellipse cx="230" cy="214" rx="78" ry="13" fill="#b0cfdf"/><rect x="198" y="93" width="64" height="115" rx="12" fill="#ffdcaa" stroke="#d69e6e" stroke-width="5"/><path d="M198 103H263" stroke="#f9bf7c" stroke-width="4"/><path d="M230 92V72" stroke="#394e5e" stroke-width="6" stroke-linecap="round"/>${melting?'<path d="M196 130Q190 156 205 158Q221 157 214 130M262 127Q270 157 252 161" fill="none" stroke="#dca371" stroke-width="9" stroke-linecap="round"/><ellipse cx="230" cy="213" rx="80" ry="12" fill="#ffd594"/>':''}${flame?'<path d="M230 28C253 55 246 79 230 94C210 86 205 65 230 28Z" fill="#ff8b30"/><path d="M230 48C241 65 238 78 228 88C219 76 223 62 230 48Z" fill="#fff1a0"/><path d="M275 54Q289 44 276 30" stroke="#ffca73" stroke-width="4" fill="none" stroke-linecap="round"/>':''}`;
function draw(type){let s='';
switch(type){
case 'ice':s=cup('#d1eeff',18,'<rect x="186" y="132" width="37" height="35" rx="5" fill="#8fddfa" stroke="#4cb8e9" stroke-width="4" transform="rotate(-10 200 142)"/><rect x="238" y="140" width="35" height="32" rx="5" fill="#b5ecff" stroke="#62bfe3" stroke-width="4" transform="rotate(12 240 142)"/>');break;
case 'water':s=cup('#6fc7ef',67,'<path d="M176 147Q196 137 215 147T257 147T288 147" stroke="#fff" stroke-width="5" fill="none"/>');break;
case 'paper':s='<rect x="155" y="45" width="150" height="165" rx="7" fill="white" stroke="#739bb1" stroke-width="5"/><path d="M180 90H278M180 116H263M180 144H278" stroke="#b5d3e1" stroke-width="5" stroke-linecap="round"/>';break;
case 'torn':s='<path d="M150 50L230 45L212 112L157 125Z" fill="white" stroke="#729cb5" stroke-width="5"/><path d="M242 57L319 65L301 134L221 127Z" fill="white" stroke="#729cb5" stroke-width="5"/><path d="M160 145L214 134L225 203L152 197Z" fill="white" stroke="#729cb5" stroke-width="5"/><path d="M235 147L307 143L315 207L240 210Z" fill="white" stroke="#729cb5" stroke-width="5"/>';break;
case 'egg':s='<ellipse cx="230" cy="188" rx="107" ry="29" fill="#8daabc"/><rect x="136" y="118" width="188" height="74" rx="38" fill="#434f61"/><ellipse cx="230" cy="147" rx="75" ry="22" fill="#f5ede2"/><circle cx="230" cy="147" r="24" fill="#f1a526"/><ellipse cx="230" cy="147" rx="9" ry="7" fill="#ffca68"/>';break;
case 'cooked':s='<ellipse cx="230" cy="188" rx="107" ry="29" fill="#8daabc"/><rect x="136" y="118" width="188" height="74" rx="38" fill="#434f61"/><path d="M176 147C176 121 200 117 226 124C261 110 293 127 288 154C302 171 254 177 232 171C200 183 168 168 176 147Z" fill="white"/><circle cx="232" cy="147" r="26" fill="#efab24"/><ellipse cx="230" cy="143" rx="11" ry="6" fill="#ffd477"/>';break;
case 'sugar':s=cup('#b4e8fc',64,'<rect x="191" y="151" width="15" height="15" rx="3" fill="white" transform="rotate(15 200 150)"/><rect x="239" y="162" width="16" height="16" rx="2" fill="white"/><rect x="215" y="184" width="14" height="13" rx="3" fill="white"/>');break;
case 'dissolved':s=cup('#bbecff',64,'<g fill="#fff" opacity=".85"><circle cx="199" cy="142" r="3"/><circle cx="252" cy="160" r="3"/><circle cx="226" cy="190" r="3"/><circle cx="278" cy="184" r="3"/><circle cx="188" cy="181" r="3"/><circle cx="228" cy="151" r="3"/></g>');break;
case 'soda':s=cup('#9ee1ec',67,'<path d="M175 146L186 130L198 146L210 131L225 146L240 135L255 147" fill="none" stroke="#fff" stroke-width="5"/>')+'<path d="M180 47L205 40L218 62" stroke="#c3c6cb" stroke-width="12" fill="none" stroke-linecap="round"/>';break;
case 'fizz':s=cup('#b0ebc9',76,'<path d="M172 134Q194 114 212 133T260 132T289 129" stroke="white" stroke-width="7" fill="none"/><g fill="#fff" stroke="#53bba1" stroke-width="3"><circle cx="192" cy="154" r="9"/><circle cx="219" cy="118" r="10"/><circle cx="263" cy="143" r="9"/><circle cx="244" cy="101" r="12"/><circle cx="202" cy="80" r="8"/><circle cx="274" cy="75" r="9"/></g>');break;
case 'heat':s=cup('#75ccf3',78,'<path d="M185 128H277" stroke="white" stroke-width="4" opacity=".7"/>')+'<path d="M190 233L203 218M220 233L233 218M250 233L263 218" stroke="#ed9248" stroke-width="8" stroke-linecap="round"/>';break;
case 'boil':s=cup('#75ccf3',79,'<g fill="none" stroke="#eaffff" stroke-width="4"><circle cx="191" cy="170" r="12"/><circle cx="251" cy="172" r="10"/><circle cx="214" cy="139" r="11"/><circle cx="275" cy="125" r="7"/><circle cx="236" cy="188" r="6"/></g>')+'<path d="M200 42Q184 26 199 12M244 44Q227 22 247 8M273 44Q259 25 270 12" stroke="#7bbfd4" stroke-width="6" stroke-linecap="round" fill="none"/>';break;
case 'nail':s='<g transform="rotate(25 225 140)"><rect x="145" y="132" width="184" height="16" rx="6" fill="#9fb5c4" stroke="#5d8099" stroke-width="4"/><rect x="138" y="119" width="26" height="42" rx="5" fill="#bed1db" stroke="#5d8099" stroke-width="4"/><path d="M322 132L344 140L323 149Z" fill="#86a1b4"/></g>';break;
case 'rust':s='<g transform="rotate(25 225 140)"><rect x="145" y="132" width="184" height="16" rx="6" fill="#b67c51" stroke="#8b624c" stroke-width="4"/><rect x="138" y="119" width="26" height="42" rx="5" fill="#ad7c57" stroke="#825e4f" stroke-width="4"/><path d="M322 132L344 140L323 149Z" fill="#ad744d"/><g fill="#e1a24b"><circle cx="181" cy="143" r="5"/><circle cx="211" cy="137" r="7"/><circle cx="251" cy="144" r="6"/><circle cx="281" cy="139" r="7"/></g></g>';break;
case 'dye':s=cup('#d0effc',63,'<path d="M230 89C238 106 245 115 230 128C215 116 221 103 230 89Z" fill="#2c78bf"/>');break;
case 'color':s=cup('#72addf',68,'<path d="M180 138Q211 162 244 140T288 162" fill="none" stroke="#4295d7" stroke-width="6" opacity=".9"/>');break;
case 'unlit':s=candle(false,false);break;
case 'burn':s=candle(true,false);break;
case 'wax':s='<path d="M182 104Q184 91 197 92H263Q275 93 278 106V185Q274 199 261 199H198Q184 198 181 185Z" fill="#ffdfa7" stroke="#d5ae79" stroke-width="5"/><path d="M185 119H276" stroke="#f5c78a" stroke-width="5"/>';break;
case 'melt':s='<ellipse cx="230" cy="204" rx="104" ry="16" fill="#dfb67e"/><path d="M137 188Q163 166 192 173T244 174T296 172Q323 175 323 199Q298 212 238 209T144 204Z" fill="#ffdca1" stroke="#d4ab70" stroke-width="5"/><path d="M189 184Q235 177 278 186" fill="none" stroke="#ffefc5" stroke-width="6"/>';break;
}
return svgWrap(s)}
render();
</script>
