const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>Math.max(0,Math.min(100,Math.round(n)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const mixc=(a,b,k)=>a.map((v,i)=>Math.round(lerp(v,b[i],k)));
const mark=(k,condition=true)=>{if(condition)state.done[k]=true};
const sayN=(n,t)=>n===t?'Идеально! 🎉':n>=t*.6?'Хорошо! Посмотри разбор 👀':'Ничего страшного — разберём вместе 💪';

/* ======================= ДВИЖОК АНИМАЦИЙ ======================= */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
let loops=[],raf=0,lastT=0,clock=0;
function frame(t){const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;clock+=dt;for(const f of loops)f(dt,clock);raf=requestAnimationFrame(frame)}
function addLoop(f){loops.push(f);if(!raf){lastT=performance.now();raf=requestAnimationFrame(frame)}}
function stopAnims(){loops=[];if(raf)cancelAnimationFrame(raf);raf=0}
function mk(id,W,H){const c=document.getElementById(id);if(!c)return null;const d=Math.min(2,window.devicePixelRatio||1);c.width=W*d;c.height=H*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return{c,x,W,H}}
function rr(x,X,y,w,h,r){x.beginPath();x.moveTo(X+r,y);x.arcTo(X+w,y,X+w,y+h,r);x.arcTo(X+w,y+h,X,y+h,r);x.arcTo(X,y+h,X,y,r);x.arcTo(X,y,X+w,y,r);x.closePath()}
function drawP(ctx,p,x,y,a){ctx.globalAlpha=a==null?1:a;if(p.t==='mud'){ctx.fillStyle='#7a5a38';ctx.beginPath();ctx.arc(x,y,p.r,0,6.3);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(x-p.r*.3,y-p.r*.3,p.r*.35,0,6.3);ctx.fill()}else if(p.t==='odor'){ctx.fillStyle='rgba(242,153,74,.28)';ctx.beginPath();ctx.arc(x,y,p.r*1.9,0,6.3);ctx.fill();ctx.fillStyle='#f2994a';ctx.beginPath();ctx.arc(x,y,p.r,0,6.3);ctx.fill()}else{const na=p.u<.5;ctx.fillStyle=na?'#3d93f0':'#ffffff';ctx.strokeStyle='#6fa4cf';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,p.r*(na?.8:1.1),0,6.3);ctx.fill();ctx.stroke()}ctx.globalAlpha=1}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);const x=c.getContext('2d');const cols=['#0d8ca2','#25a993','#ea9350','#f2c94c','#2972bd','#e86f8b'];const ps=Array.from({length:120},()=>({x:window.innerWidth/2+(Math.random()-.5)*240,y:window.innerHeight*.62,vx:(Math.random()-.5)*1000,vy:-450-Math.random()*650,r:4+Math.random()*5,c:cols[Math.random()*6|0],rot:Math.random()*6,vr:(Math.random()-.5)*12}));let last=performance.now(),life=0;(function f(t){const dt=Math.min(.04,(t-last)/1000);last=t;life+=dt;x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=1400*dt;p.vx*=.992;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-life/2.6);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(life<2.6)requestAnimationFrame(f);else c.remove()})(last)}

/* ---- частицы и правила фильтрации (одни и те же для анимации и для оценки) ---- */
function makeSet(sample,seed){const R=rng(seed),out=[];const m1=(t,r)=>({t,r,u:R(),v:R(),w:R(),ph:R()*6.28,f1:1+R()*2,f2:1+R()*2});
 const nm={mud:46,odor:8,salt:0}[sample],no={mud:0,odor:34,salt:0}[sample],ns={mud:0,odor:0,salt:44}[sample];
 for(let i=0;i<nm;i++)out.push(m1('mud',1.5+R()*4.6));for(let i=0;i<no;i++)out.push(m1('odor',3.3));for(let i=0;i<ns;i++)out.push(m1('salt',2.4));return out}
function blocks(layer,p){if(p.t!=='mud')return false;if(layer==='gravel'||layer==='mesh')return p.r>=4.6;if(layer==='sand')return p.r>=2.3;if(layer==='cotton')return p.r>=2.9;if(layer==='charcoal')return p.r>=5.4;return false}
function fate(layers,p){let k=0;for(let i=0;i<layers.length;i++){const L=layers[i];if(L==='charcoal'&&p.t==='odor'){if(p.w<[.68,.86,.94][Math.min(k,2)])return i;k++;continue}if(blocks(L,p))return i}return -1}
function outcome(layers,sample){const ps=makeSet(sample,7);let tm=0,pm=0,to=0,po=0,caught=0;for(const p of ps){const f=fate(layers,p);if(p.t==='mud'){tm+=p.r*p.r;if(f<0)pm+=p.r*p.r}if(p.t==='odor'){to++;if(f<0)po++}if(f>=0)caught++}return{clarity:tm?pct(100*(1-pm/tm)):100,odor:to?pct(100*(1-po/to)):100,caught,total:ps.length}}

const LCOL={gravel:'#d9d6c8',sand:'#f0dba6',charcoal:'#3c4650',cotton:'#fbfdfd',mesh:'rgba(205,230,238,.6)'};
const SHORT={gravel:'Гравий',sand:'Песок',charcoal:'Уголь',cotton:'Вата',mesh:'Сетка'};
function drawLayer(ctx,type,x,y,w,h,idx){const R=rng(idx*131+type.length*7+3);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle=LCOL[type];ctx.fillRect(x,y,w,h);
 if(type==='gravel'){const n=Math.max(10,w*h/260|0);for(let i=0;i<n;i++){const g=150+R()*70|0;ctx.fillStyle=`rgb(${g},${g-4},${g-14})`;ctx.beginPath();ctx.ellipse(x+R()*w,y+R()*h,5+R()*5,4+R()*4,R()*3,0,6.3);ctx.fill()}}
 else if(type==='sand'){const n=Math.max(30,w*h/12|0);const cs=['#d6b873','#f6e7bd','#c9a45c','#e8cf92'];for(let i=0;i<n;i++){ctx.fillStyle=cs[i%4];ctx.beginPath();ctx.arc(x+R()*w,y+R()*h,1+R()*1.6,0,6.3);ctx.fill()}}
 else if(type==='charcoal'){const n=Math.max(14,w*h/90|0);for(let i=0;i<n;i++){ctx.fillStyle=i%3?'#56636f':'#2a323a';ctx.beginPath();ctx.arc(x+R()*w,y+R()*h,1.5+R()*3,0,6.3);ctx.fill()}}
 else if(type==='cotton'){const n=Math.max(10,w*h/160|0);for(let i=0;i<n;i++){ctx.fillStyle='rgba(235,244,246,.95)';ctx.strokeStyle='rgba(180,200,208,.6)';ctx.beginPath();ctx.arc(x+R()*w,y+R()*h,6+R()*6,0,6.3);ctx.fill();ctx.stroke()}}
 else{ctx.strokeStyle='#4b6b7a';ctx.lineWidth=1.4;for(let a=x;a<x+w;a+=9){ctx.beginPath();ctx.moveTo(a,y);ctx.lineTo(a,y+h);ctx.stroke()}for(let b=y;b<y+h;b+=9){ctx.beginPath();ctx.moveTo(x,b);ctx.lineTo(x+w,b);ctx.stroke()}}
 ctx.restore();ctx.strokeStyle='rgba(60,90,105,.35)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1)}

function jarSim(id,sample,getT,opt){opt=opt||{};const C=mk(id,300,340);if(!C)return;const ctx=C.x;const R=rng(5);
 const ps=[];const base=t=>({t,hx:66+R()*168,hy:104+R()*192,u:R(),v:R(),w:R(),ph:R()*6.28,f1:1+R()*2,f2:1+R()*2});
 const addMud=(n,r0,r1)=>{for(let i=0;i<n;i++){const p=base('mud');p.r=r0+R()*(r1-r0);const rn=(p.r-1.5)/4.6;p.d=R()*1.5;p.dur=p.w<.12?1e9:4+(1-rn)*15;p.fl=304-p.r-p.v*10;ps.push(p)}};
 if(sample==='mud')addMud(70,1.5,6.1);
 if(sample==='odor'){addMud(6,1.5,3);for(let i=0;i<38;i++){const p=base('odor');p.r=3.3;ps.push(p)}}
 if(sample==='salt')for(let i=0;i<72;i++){const p=base('salt');p.r=2.4;ps.push(p)}
 let cur=opt.persist?anim.settleT:0;const amp=opt.amp||5;const SURF=92,BOT=312;
 const jarPath=top=>{ctx.beginPath();ctx.moveTo(52,top);ctx.lineTo(52,282);ctx.quadraticCurveTo(52,BOT,82,BOT);ctx.lineTo(218,BOT);ctx.quadraticCurveTo(248,BOT,248,282);ctx.lineTo(248,top)};
 const qOf=(p,T)=>p.t==='mud'?clamp((T-p.d)/p.dur,0,1):0;
 addLoop((dt,t)=>{cur+=(getT()-cur)*Math.min(1,dt*2.4);if(opt.persist)anim.settleT=cur;
  ctx.clearRect(0,0,300,340);let nm=0,set=0,sus=0;for(const p of ps)if(p.t==='mud'){nm++;const q=qOf(p,cur);set+=q;sus+=1-q}
  const cl=nm?sus/nm:0;let col=[196,230,242];if(sample==='mud')col=mixc(col,[168,138,98],cl*.8);if(sample==='odor')col=mixc(col,[225,205,130],.55);
  ctx.beginPath();ctx.moveTo(52,SURF);for(let x=52;x<=248;x+=8)ctx.lineTo(x,SURF+Math.sin(x*.07+t*2.2)*2.2);ctx.lineTo(248,282);ctx.quadraticCurveTo(248,BOT,218,BOT);ctx.lineTo(82,BOT);ctx.quadraticCurveTo(52,BOT,52,282);ctx.closePath();ctx.fillStyle=`rgba(${col},.85)`;ctx.fill();
  const sedH=(nm?set/nm:0)*18;if(sedH>.5){ctx.save();jarPath(0);ctx.closePath();ctx.clip();const g=ctx.createLinearGradient(0,BOT-sedH,0,BOT);g.addColorStop(0,'#a58259');g.addColorStop(1,'#7a5a36');ctx.fillStyle=g;ctx.fillRect(40,BOT-sedH,220,sedH+2);ctx.restore()}
  for(const p of ps){let x,y;if(p.t==='mud'){const q=qOf(p,cur);x=p.hx+Math.sin(t*p.f1+p.ph)*(amp*(1-q)+.3);y=lerp(p.hy,p.fl,q)+Math.cos(t*p.f2+p.ph)*2.5*(1-q)}else if(p.t==='odor'){x=p.hx+Math.sin(t*.8*p.f1+p.ph)*18;y=clamp(p.hy+Math.cos(t*.7*p.f2+p.ph*2)*16,100,300)}else{x=p.hx+Math.sin(t*3*p.f1+p.ph)*3.5;y=p.hy+Math.cos(t*3.2*p.f2+p.ph)*3.5}
   drawP(ctx,p,clamp(x,60,240),y,.95)}
  if(sample==='odor'){ctx.lineWidth=3;ctx.lineCap='round';for(let i=0;i<3;i++){ctx.strokeStyle=`rgba(230,140,60,${.35+.2*Math.sin(t*2+i)})`;ctx.beginPath();for(let y=84;y>=14;y-=4){const x=100+i*50+Math.sin(y*.12-t*3+i)*7;if(y===84)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}}
  ctx.strokeStyle='rgba(120,175,200,.95)';ctx.lineWidth=5;ctx.lineCap='butt';jarPath(40);ctx.stroke();ctx.beginPath();ctx.moveTo(44,40);ctx.lineTo(256,40);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(64,112);ctx.lineTo(64,250);ctx.stroke();
  if(opt.clock){ctx.fillStyle='rgba(16,40,61,.85)';rr(ctx,176,6,118,30,15);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('⏱ '+Math.round(cur)+' мин',235,27)}
 })}

/* ======================= КРУПНЫЕ СИМУЛЯЦИИ ======================= */
function filterSim(sample,material,go){const C=mk('filterCanvas',520,420);if(!C)return;const ctx=C.x;const cx=260;
 const hw=y=>y<=215?150-(y-20)*(140/195):10;const BT=130,BB=170,TIP=250,BKB=404,BKH=112,BKW=96;
 const ps=makeSet(sample,11);let T=0,caught=0,passed=0,pmW=0,pO=0,drops=[],dropT=0;
 ps.forEach(p=>{p.hy=46+p.u*76;p.hx=cx+(p.v*2-1)*(hw(p.hy)-p.r-8);p.x=p.hx;p.y=p.hy;p.st='idle';p.d=p.w*3.5;p.depth=p.v;p.bl=blocks(material,p)});
 const wH=()=>6+BKH*.55*clamp((T-.5)/7,0,1);
 function step(dt){T+=dt;for(const p of ps){
  if(p.st==='idle'){if(go&&T>=p.d){p.st='fall'}else{p.x=p.hx+Math.sin(T*p.f1+p.ph)*3;p.y=p.hy+Math.cos(T*p.f2+p.ph)*3;continue}}
  if(p.st==='fall'){const vy=p.y<BT?62:p.y<BB?(p.t==='mud'?20:26):p.y<TIP?110:230;p.y+=vy*dt;p.x+=Math.sin(T*5+p.ph)*10*dt;
   if(p.y<215){const m=hw(p.y)-p.r-3;p.x=clamp(p.x,cx-m,cx+m)}
   if(p.y>BB-10&&p.y<TIP)p.x+=(cx-p.x)*Math.min(1,dt*3.5);
   if(p.bl&&p.y>=BT-2+p.depth*14){p.st='caught';caught++;p.y=BT-2+p.depth*14;continue}
   if(p.y>=BKB-wH()){p.st='done';passed++;if(p.t==='mud')pmW+=p.r*p.r;if(p.t==='odor')pO++;p.tx=cx+(p.u-.5)*(BKW*2-28)}
  }else if(p.st==='done'){p.x+=(p.tx-p.x)*Math.min(1,dt*1.6);const ty=BKB-8-p.v*Math.max(6,wH()-16);p.y+=(ty-p.y)*Math.min(1,dt*1.5)}
 }
 if(go&&T<10){dropT+=dt;if(dropT>.14){dropT=0;drops.push({x:cx+(Math.random()-.5)*4,y:TIP+4})}}
 for(const d of drops)d.y+=250*dt;drops=drops.filter(d=>d.y<BKB-wH())}
 const sc={mud:[170,142,100],odor:[228,205,135],salt:[200,230,244]}[sample];
 const tmW=ps.reduce((a,p)=>a+(p.t==='mud'?p.r*p.r:0),0),tO=ps.filter(p=>p.t==='odor').length;
 function draw(){ctx.clearRect(0,0,520,420);
  const wh=wH();const wc=mixc(mixc([196,230,242],[168,138,98],(tmW?pmW/tmW:0)*.8),[225,200,120],(tO?pO/tO:0)*.5);
  ctx.save();rr(ctx,cx-BKW,BKB-BKH,BKW*2,BKH,12);ctx.clip();ctx.fillStyle=`rgba(${wc},.85)`;ctx.beginPath();ctx.moveTo(cx-BKW,BKB-wh);for(let x=cx-BKW;x<=cx+BKW;x+=8)ctx.lineTo(x,BKB-wh+Math.sin(x*.08+T*2.4)*1.6);ctx.lineTo(cx+BKW,BKB);ctx.lineTo(cx-BKW,BKB);ctx.closePath();ctx.fill();ctx.restore();
  for(const p of ps)if(p.st==='done')drawP(ctx,p,p.x+Math.sin(T*p.f1+p.ph)*1.5,p.y+Math.cos(T*p.f2+p.ph)*1.5);
  ctx.strokeStyle='rgba(120,175,200,.95)';ctx.lineWidth=4;rr(ctx,cx-BKW,BKB-BKH,BKW*2,BKH,12);ctx.stroke();
  const idleN=ps.filter(p=>p.st==='idle').length/ps.length;
  ctx.fillStyle=`rgba(${mixc([196,230,242],sc,idleN)},.7)`;ctx.beginPath();ctx.moveTo(cx-hw(34),34);ctx.lineTo(cx+hw(34),34);ctx.lineTo(cx+hw(BT),BT);ctx.lineTo(cx-hw(BT),BT);ctx.closePath();ctx.fill();
  ctx.save();ctx.beginPath();ctx.moveTo(cx-hw(BT),BT);ctx.lineTo(cx+hw(BT),BT);ctx.lineTo(cx+hw(BB),BB);ctx.lineTo(cx-hw(BB),BB);ctx.closePath();ctx.clip();drawLayer(ctx,material,cx-hw(BT),BT,hw(BT)*2,BB-BT,9);ctx.restore();
  ctx.strokeStyle='rgba(110,165,190,.95)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx-hw(20),20);ctx.lineTo(cx-10,215);ctx.lineTo(cx-10,TIP);ctx.moveTo(cx+hw(20),20);ctx.lineTo(cx+10,215);ctx.lineTo(cx+10,TIP);ctx.moveTo(cx-hw(20)-9,20);ctx.lineTo(cx+hw(20)+9,20);ctx.stroke();
  for(const p of ps)if(p.st!=='done')drawP(ctx,p,p.x,p.y);
  ctx.fillStyle='rgba(90,170,220,.9)';for(const d of drops){ctx.beginPath();ctx.arc(d.x,d.y,2.6,0,6.3);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.9)';rr(ctx,6,306,150,86,12);ctx.fill();ctx.strokeStyle='#cfe5ee';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#163247';ctx.font='bold 14px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('Частиц всего: '+ps.length,14,328);ctx.fillStyle='#a4443f';ctx.fillText('⛔ Задержано: '+caught,14,352);ctx.fillStyle='#0b7a62';ctx.fillText('💧 Прошло: '+passed,14,376);
  ctx.fillStyle='#4b6b7a';ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(SHORT[material]+' — фильтрующий слой',cx,BB+24+36)}
 addLoop(dt=>{step(dt);draw()})}

function adsSim(material,usage,go){const C=mk('adsCanvas',640,360);if(!C)return;const ctx=C.x;
 const ch=material==='charcoal',used=usage==='used';const cx=320,cy=186,BR=62;const R=rng(9);
 const sites=[];if(ch)for(let i=0;i<16;i++){const a=i/16*6.283+.2;sites.push({x:cx+Math.cos(a)*(BR+8),y:cy+Math.sin(a)*(BR+8),st:(used&&![2,7,12].includes(i))?'old':'free',res:false})}
 const rocks=[{x:296,y:196,r:40},{x:356,y:176,r:34},{x:340,y:238,r:30}];
 const ms=[];for(let i=0;i<20;i++){let x,y;do{x=40+R()*560;y=44+R()*270}while(Math.hypot(x-cx,y-cy)<BR+40);ms.push({x,y,vx:(R()-.5)*70,vy:(R()-.5)*70,st:'free',site:-1,ph:R()*6.28})}
 const pores=[];for(let i=0;i<26;i++){const a=R()*6.283,d=Math.sqrt(R())*(BR-12);pores.push([Math.cos(a)*d,Math.sin(a)*d,2+R()*3.5])}
 let T=0;
 function step(dt){T+=dt;const freeLeft=sites.some(s=>s.st==='free'&&!s.res);
  for(const m of ms){if(m.st==='stuck')continue;
   if(m.site>=0){const s=sites[m.site];const dx=s.x-m.x,dy=s.y-m.y,d=Math.hypot(dx,dy);if(d<3){m.st='stuck';m.x=s.x;m.y=s.y;s.st='new'}else{const sp=Math.min(d,110*dt);m.x+=dx/d*sp;m.y+=dy/d*sp}continue}
   m.vx+=(R()-.5)*300*dt;m.vy+=(R()-.5)*300*dt;if(go&&ch&&freeLeft){m.vx+=(cx-m.x)*.35*dt;m.vy+=(cy-m.y)*.35*dt}
   const sp=Math.hypot(m.vx,m.vy);if(sp>70){m.vx*=70/sp;m.vy*=70/sp}
   m.x+=m.vx*dt;m.y+=m.vy*dt;
   if(m.x<30){m.x=30;m.vx=Math.abs(m.vx)}if(m.x>610){m.x=610;m.vx=-Math.abs(m.vx)}if(m.y<34){m.y=34;m.vy=Math.abs(m.vy)}if(m.y>326){m.y=326;m.vy=-Math.abs(m.vy)}
   const obs=ch?[{x:cx,y:cy,r:BR}]:rocks;
   for(const o of obs){const dx=m.x-o.x,dy=m.y-o.y,d=Math.hypot(dx,dy),mr=o.r+7;if(d<mr&&d>0){m.x=o.x+dx/d*mr;m.y=o.y+dy/d*mr;const dot=m.vx*dx/d+m.vy*dy/d;if(dot<0){m.vx-=2*dot*dx/d;m.vy-=2*dot*dy/d}}}
   if(go&&ch){const d=Math.hypot(m.x-cx,m.y-cy);if(d<BR+120){let best=-1,bd=1e9;sites.forEach((s,i)=>{if(s.st==='free'&&!s.res){const dd=Math.hypot(s.x-m.x,s.y-m.y);if(dd<bd){bd=dd;best=i}}});if(best>=0){m.site=best;sites[best].res=true}}}
  }}
 function draw(){ctx.clearRect(0,0,640,360);ctx.fillStyle='#d8eff6';rr(ctx,14,14,612,332,22);ctx.fill();ctx.strokeStyle='#85b9d0';ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<8;i++){const y=330-((T*20+i*43)%300);ctx.beginPath();ctx.arc(60+i*78+Math.sin(T+i)*8,y,3+(i%3),0,6.3);ctx.fill()}

function columnSim(id,W,H,layers,sample,go,opt){opt=opt||{};const C=mk(id,W,H);if(!C)return;const ctx=C.x;
 const cx=W/2,cw=Math.min(190,W*.52),L=cx-cw/2,Rt=cx+cw/2,top=16,y0=H*.24,n=layers.length;
 const lh=Math.min(56,(H*.62-y0)/Math.max(n,3)),yEnd=y0+n*lh,tip=yEnd+24,bb=H-44,bh=H*.2,bt=bb-bh;
 const ps=makeSet(sample,7);let T=0,caught=0,passed=0,pmW=0,pO=0,tmW=0,tO=0,done=false,drops=[],dropT=0;
 ps.forEach(p=>{p.fate=fate(layers,p);p.hx=L+12+p.u*(cw-24);p.hy=top+24+p.v*(y0-top-40);p.x=p.hx;p.y=p.hy;p.st='idle';p.d=p.w*3.4;p.depth=.12+p.v*.7;if(p.t==='mud')tmW+=p.r*p.r;if(p.t==='odor')tO++});
 const wH=()=>6+bh*.55*clamp((T-1)/8,0,1);
 const sc={mud:[170,142,100],odor:[228,205,135],salt:[200,230,244]}[sample];
 function step(dt){T+=dt;for(const p of ps){
  if(p.st==='idle'){if(go&&T>=p.d){p.st='fall'}else{p.x=p.hx+Math.sin(T*p.f1+p.ph)*3;p.y=p.hy+Math.cos(T*p.f2+p.ph)*3;continue}}
  if(p.st==='fall'){const vy=p.y<y0?55:p.y<yEnd?(p.t==='mud'?24:30):p.y<tip?110:230;p.y+=vy*dt;
   if(p.y<tip){p.x+=Math.sin(T*5+p.ph)*8*dt;let m=cw/2-p.r-3;if(p.y>yEnd){const k=clamp((p.y-yEnd)/24,0,1);m=lerp(m,7-p.r*.5,k);p.x+=(cx-p.x)*Math.min(1,dt*5)}p.x=clamp(p.x,cx-m,cx+m)}
   if(p.y>=y0&&p.y<yEnd){const j=Math.floor((p.y-y0)/lh);if(p.fate===j&&p.y>=y0+j*lh+p.depth*lh){p.st='caught';caught++;continue}}
   if(p.y>=bb-wH()){p.st='done';passed++;if(p.t==='mud')pmW+=p.r*p.r;if(p.t==='odor')pO++;p.tx=cx+(p.u-.5)*(cw-30)}
  }else if(p.st==='done'){p.x+=(p.tx-p.x)*Math.min(1,dt*1.6);const ty=bb-8-p.v*Math.max(6,wH()-16);p.y+=(ty-p.y)*Math.min(1,dt*1.5)}
 }
 if(go&&T<11){dropT+=dt;if(dropT>.14){dropT=0;drops.push({x:cx+(Math.random()-.5)*4,y:tip+6})}}
 for(const d of drops)d.y+=240*dt;drops=drops.filter(d=>d.y<bb-wH());
 if(!done&&go&&ps.every(p=>p.st==='caught'||p.st==='done')){done=true;if(!opt.fast&&opt.onDone)opt.onDone()}}
 function draw(){ctx.clearRect(0,0,W,H);const wh=wH();
  const wc=mixc(mixc([196,230,242],[168,138,98],(tmW?pmW/tmW:0)*.8),[225,200,120],(tO?pO/tO:0)*.5);
  ctx.save();rr(ctx,L,bt,cw,bh,12);ctx.clip();ctx.fillStyle=`rgba(${wc},.85)`;ctx.beginPath();ctx.moveTo(L,bb-wh);for(let x=L;x<=Rt;x+=8)ctx.lineTo(x,bb-wh+Math.sin(x*.08+T*2.4)*1.6);ctx.lineTo(Rt,bb);ctx.lineTo(L,bb);ctx.closePath();ctx.fill();ctx.restore();
  for(const p of ps)if(p.st==='done')drawP(ctx,p,p.x+Math.sin(T*p.f1+p.ph)*1.5,p.y+Math.cos(T*p.f2+p.ph)*1.5);
  ctx.strokeStyle='rgba(120,175,200,.95)';ctx.lineWidth=4;rr(ctx,L,bt,cw,bh,12);ctx.stroke();
  const idleN=ps.filter(p=>p.st==='idle').length/ps.length;ctx.fillStyle=`rgba(${mixc([196,230,242],sc,idleN)},.7)`;ctx.fillRect(L,top+6,cw,y0-top-6);
  for(let i=0;i<n;i++)drawLayer(ctx,layers[i],L,y0+i*lh,cw,lh,i);
  ctx.strokeStyle='rgba(110,165,190,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(L,top);ctx.lineTo(L,yEnd);ctx.lineTo(cx-7,tip);ctx.lineTo(cx-7,tip+10);ctx.moveTo(Rt,top);ctx.lineTo(Rt,yEnd);ctx.lineTo(cx+7,tip);ctx.lineTo(cx+7,tip+10);ctx.moveTo(L-8,top);ctx.lineTo(Rt+8,top);ctx.stroke();
  for(const p of ps)if(p.st!=='done')drawP(ctx,p,p.x,p.y);
  ctx.fillStyle='rgba(90,170,220,.9)';for(const d of drops){ctx.beginPath();ctx.arc(d.x,d.y,2.6,0,6.3);ctx.fill()}
  ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='left';ctx.fillStyle='#355a6e';for(let i=0;i<n;i++)ctx.fillText(SHORT[layers[i]],Rt+10,y0+i*lh+lh/2+4);
  if(!n){ctx.fillStyle='#6b8796';ctx.textAlign='center';ctx.fillText('Добавь слои — и запускай воду',cx,y0+24)}
  ctx.fillStyle='#163247';ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(opt.showOdor?'Запах в стакане: '+pO+' мол.':'Задержано: '+caught+'  ·  Прошло: '+passed,cx,H-14)}
 if(opt.fast){for(let i=0;i<420;i++)step(.05)}
 draw();addLoop(dt=>{step(dt);draw()})}

   else{const s=clamp((cyc-.12)/.4,0,1),e=s*s*(3-2*s),aa=p.i/N*6.283,sx=30+p.u*180,sy=48+p.v*90,dr=(1-e)*8;x=lerp(sx+Math.sin(t*2+p.ph*9)*dr,120+Math.cos(aa)*37,e);y=lerp(sy+Math.cos(t*2+p.ph*9)*dr,92+Math.sin(aa)*37,e);pp={t:'odor',r:4}}

function stage3(){let recs=Object.values(state.filterRecords);return `<div class="panel"><h3>Опыт 2. Фильтрация: поры и частицы</h3><p class="sub">Меняйте только материал и смотрите, кого он задерживает. Важны размер частиц и свойства слоя.</p><div class="twocol" style="align-items:start"><div><h4>Шаг А. Исходная проба</h4><div style="display:grid;gap:8px">${Object.keys(SAMPLES).map(sampleCard).join('')}</div><h4 style="margin-top:16px">Шаг Б. Материал</h4><div style="display:grid;gap:8px">${chips(fOptions,'filter-material','id',state.filterMaterial)}</div><div class="actions"><button class="primary ${anim.filterGo?'':'pulse'}" data-action="filter-run">💧 ${anim.filterGo?'Повторить опыт':'Налить воду в воронку'}</button></div></div><div><div class="simbox"><canvas id="filterCanvas" role="img" aria-label="Воронка с фильтром: частицы застревают или проходят"></canvas></div>${legend(state.sample)}</div></div>${recs.length?`<h4 style="margin-top:18px">Результаты виртуальных испытаний</h4><div class="twocol">${recs.map(r=>`<div class="comparison"><div class="smallcaps">${esc(r.sample)} / ${esc(r.material)}</div><b>${esc(r.assessment)}</b><p class="sub">${esc(r.result)}</p></div>`).join('')}</div>`:''}</div><div class="panel"><h3>Проверь объяснение</h3><div class="note"><b>Фильтр — не волшебная перегородка.</b> Крупная сетка не задержит растворённые ионы соли. Песок и ткань помогают убрать часть взвеси. Они не доказывают отсутствие бактерий и других опасных примесей.</div></div>`}
function stage4(){let r=Object.values(state.adsRecords);return `<div class="panel"><h3>Опыт 3. Адсорбция</h3><p class="sub">Исходная проба одинакова: вода с <b>условной органической примесью</b>, способной частично удерживаться на активированном угле. Сравните сорбенты и посмотрите, что бывает при насыщении.</p><div class="twocol">${chips([['charcoal','Активированный уголь','Много поверхности и пор'],['gravel','Гравий','Сравнение без активного сорбента']],'ads-material','id',state.adsMaterial)}</div><h4 style="margin-top:18px">Состояние материала</h4><div class="answers">${[['fresh','Свежий'],['used','Уже использованный']].map(([id,name])=>`<button class="choice ${state.adsUsage===id?'active':''}" data-action="ads-usage" data-id="${id}">${name}</button>`).join('')}</div><div class="actions"><button class="primary ${anim.adsGo?'':'pulse'}" data-action="ads-run">${anim.adsGo?'↻ Запустить снова':'▶ Провести виртуальный опыт'}</button></div><div class="simbox" style="margin-top:14px"><canvas id="adsCanvas" role="img" aria-label="Молекулы примеси прилипают к активированному углю"></canvas></div>${r.length?`<h4 style="margin-top:16px">Что наблюдаем</h4><div class="twocol">${r.map(q=>`<div class="comparison"><b>${esc(q.name)}</b><p>${esc(q.result)}</p><span class="pill">${esc(q.status)}</span></div>`).join('')}</div>`:''}</div><div class="panel"><h3>Как работает активированный уголь?</h3><div class="warning">Активированный уголь не является универсальным обеззараживателем и не удаляет растворённую поваренную соль в обычной школьной модели. Места на его поверхности ограничены — поэтому сорбент нужно менять.</div></div>`}
function evaluateBuild(){let ids=state.layers;const o=outcome(ids,state.buildSample);const speed=pct(95-ids.length*11-(ids.includes('sand')?18:0));return {clarity:o.clarity,odor:o.odor,caught:o.caught,total:o.total,speed,fine:ids.includes('sand')||ids.includes('cotton'),carbon:ids.includes('charcoal')}}
function buildResultHtml(){const b=state.built;if(!b)return '';return `<div class="feedback"><b>Протокол испытания:</b> ${esc(b.sampleName)}. Задержано частиц: ${b.caught} из ${b.total}. Результат условный и не является оценкой питьевой безопасности.</div><div class="chartbars">${chartItem('Прозрачность',b.clarity)}${b.sampleId!=='salt'?chartItem('Запах убран',b.odor):''}${b.sampleId==='salt'?chartItem('Соль удалена',0):''}${chartItem('Скорость',b.speed,true)}</div><p class="sub">${esc(b.comment)}</p>`}
function stage5(){return `<div class="panel"><h3>Инженерная задача: собери многослойный фильтр</h3><p class="sub">Выбери 3–6 слоёв. Порядок показан <b>сверху вниз</b> — так, как течёт вода. Добавляй материалы, меняй порядок стрелками ↑ ↓ и жми «Испытать».</p><div class="twocol" style="align-items:start"><div><h4>Добавь материал (можно повторять)</h4><div style="display:grid;gap:8px">${LAYERS.map(l=>`<button class="tile" data-action="add-layer" data-id="${l.id}"><b>${l.icon} ${esc(l.name)} ＋</b><span>${esc(l.sub)}</span></button>`).join('')}</div><h4 style="margin-top:16px">Твоя конструкция — сверху вниз</h4><div class="stackview">${state.layers.length?state.layers.map((id,i)=>{let l=LAYERS.find(x=>x.id===id);return `<div class="layer ${id}"><span>${i+1}. ${esc(l.name)}<small>${esc(l.sub)}</small></span><div class="mov"><button aria-label="Поднять слой" data-action="move-layer" data-index="${i}" data-dir="-1">↑</button><button aria-label="Опустить слой" data-action="move-layer" data-index="${i}" data-dir="1">↓</button><button aria-label="Удалить слой" data-action="remove-layer" data-index="${i}">×</button></div></div>`}).join(''):'<div class="empty">Пока слоёв нет. Добавь материалы.</div>'}</div><div class="actions"><button class="ghost" data-action="clear-layers">Очистить конструкцию</button></div></div><div><div class="simbox"><canvas id="buildCanvas" role="img" aria-label="Колонна фильтра с анимацией потока"></canvas></div><h4 style="margin-top:14px">Какую пробу проверяем?</h4><div style="display:grid;gap:8px">${Object.keys(SAMPLES).map(id=>`<button class="tile ${state.buildSample===id?'selected':''}" data-action="build-sample" data-id="${id}"><b>${ICON[id]} ${esc(SAMPLES[id].title)}</b></button>`).join('')}</div><div class="actions"><button class="primary ${anim.buildGo?'':'pulse'}" data-action="run-build">🚀 Испытать мой фильтр</button></div></div></div><div id="buildResult" class="${anim.buildGo?'hidden':''}">${buildResultHtml()}</div></div><div class="bonus"><b>Бонус инженерной команды:</b> попробуйте поменять порядок слоёв и объясните, что будет с засорением и удобством фильтра. Порядок может влиять на практическую работу, но без испытаний нельзя назвать одну конструкцию универсально лучшей.</div>`}
const FAIR=[['Что изменяем?',['Состав исходной воды','Наличие активированного угля','Температуру и объём одновременно'],1],['Что оставляем одинаковым?',['Объём и тип исходной воды, остальные слои','Только цвет стаканов','Ничего, это неважно'],0],['Что сравниваем?',['Высоту парты','Число учеников','Изменение запаха и мутности после очистки'],2],['Какой вывод допустим?',['Если запах меньше, микробов точно нет','Активированный уголь может уменьшать некоторые запахи','Уголь полностью удаляет соль'],1]];
function stage6(){let n=FAIR.filter((q,i)=>state.fair[i]===q[2]).length;return `<div class="panel"><h3>Опыт 4. Честное сравнение двух моделей</h3><p class="sub">В обоих случаях используется одна и та же исходная вода с условной органической примесью, одинаковый объём и условия. Запустите оба фильтра одновременно и сравните счётчики запаха.</p><div class="compare"><div class="simbox"><b>Фильтр А — контрольный</b><div class="mini">Гравий → песок → вата · без угля</div><canvas id="fairA" role="img" aria-label="Фильтр А без угля"></canvas></div><div class="simbox"><b>Фильтр Б — опытный</b><div class="mini">Гравий → песок → уголь → вата · добавлен уголь</div><canvas id="fairB" role="img" aria-label="Фильтр Б с углём"></canvas></div></div><div class="actions"><button class="primary ${anim.fairGo?'':'pulse'}" data-action="fair-run">${anim.fairGo?'↻ Запустить оба снова':'▶ Запустить оба опыта'}</button></div><h4 style="margin-top:18px">Проверь, что ты понял про честный опыт</h4>${FAIR.map((q,i)=>`<div class="questionrow"><span class="prompt">${i+1}. ${esc(q[0])}</span>${questionChoice('fair',i,q[1],state.fair[i],q[2],state.fairChecked)}</div>`).join('')}<div class="actions"><button class="primary" data-action="fair-check">Сравнить опыты</button></div>${state.fairChecked?`${checkResult(n,4,'Для достоверного сравнения изменяем по возможности только один фактор.')}<div class="compare" style="margin-top:14px"><div class="comparison"><b>Наблюдение А</b><p>Взвесь частично задержана; уменьшение органического запаха не выражено.</p></div><div class="comparison"><b>Наблюдение Б</b><p>Взвесь частично задержана; некоторые органические вещества могут дополнительно адсорбироваться.</p></div></div><div class="note" style="margin-top:14px"><b>Вывод:</b> дополнительный слой активированного угля может улучшить удаление <em>некоторых</em> примесей. Ни А, ни Б не доказывают безопасность для питья.</div>`:''}</div>`}
const limitCategories=['Задерживает','Может адсорбировать','Не удаляет','Безопасность неизвестна'];
function stage7(){let n=LIMITS.filter((r,i)=>state.limit[i]===limitCategories.indexOf(r[1])).length;return `<div class="panel"><h3>Что фильтр сможет и чего не сможет?</h3><p class="sub">Модель: обычный школьный фильтр из слоёв песка, гравия, ваты и активированного угля. Для каждого объекта выбери самое точное утверждение.</p>${LIMITS.map((q,i)=>`<div class="questionrow"><span class="prompt">${LIMIT_ICONS[i]} ${i+1}. ${esc(q[0])}</span>${questionChoice('limit',i,limitCategories,state.limit[i],limitCategories.indexOf(q[1]),state.limitsChecked)}</div>`).join('')}<div class="actions"><button class="primary" data-action="limit-check">Проверить гипотезы</button></div>${state.limitsChecked?`${checkResult(n,6,'Для солей, микробов и неизвестных веществ нужны другие методы и проверка качества воды.')}<div class="warning"><b>Правило безопасности:</b> прозрачная вода ≠ питьевая вода. Никогда не пробуйте воду из учебного опыта на вкус.</div>`:''}</div><div class="bonus"><b>Для сильных:</b> почему кипячение может снижать микробный риск, но не превращает солёную воду в пресную? Объясните без проведения опыта.</div>`}
function stage8(){let n=CASES.filter((q,i)=>state.cases[i]===q.correct).length;return `<div class="panel"><h3>Совет школьного эколога</h3><p class="sub">Пять задач из жизни. Класс сначала голосует, затем объясняет свой выбор.</p>${CASES.map((q,i)=>`<div class="quizq"><b>${['🌧️','💎','🌊','🧯','🧪'][i]} ${i+1}. ${esc(q.q)}</b>${questionChoice('case',i,q.opts,state.cases[i],q.correct,state.casesChecked)}${state.casesChecked?`<div class="mini" style="margin-top:8px">${state.cases[i]===q.correct?'✓ Верно. ':'→ Обсудим: '}${esc(q.why)}</div>`:''}</div>`).join('')}<div class="actions"><button class="primary" data-action="case-check">Разобрать кейсы</button></div>${state.casesChecked?checkResult(n,5,'Объяснение важнее скорости ответа.'):''}</div>`}

function stage9(){let n=QUIZ.filter((q,i)=>state.quiz[i]===q[2]).length;const rank=n===6?'🏆 Главный эколог класса':n>=4?'🔬 Юный исследователь':'🌱 Начинающий исследователь';return `<div class="panel printreport"><h3>Итоговый лабораторный отчёт</h3><p class="sub">Сводка результатов появляется автоматически по мере прохождения станций. Это <b>учебная модель</b>, а не результаты настоящего химического или микробиологического анализа.</p><table class="reporttable"><thead><tr><th>Этап</th><th>Наблюдение</th></tr></thead><tbody><tr><td>Гипотеза</td><td>${state.hyp===1?'Методы работают с разными типами примесей.':'Не записана или требует уточнения.'}</td></tr><tr><td>Отстаивание</td><td>${Object.keys(state.settleRecords).length?Object.values(state.settleRecords).map(x=>esc(x.title)).join('; '):'Не проведено'}</td></tr><tr><td>Фильтрация</td><td>${Object.values(state.filterRecords).length} испытаний</td></tr><tr><td>Адсорбция</td><td>${Object.values(state.adsRecords).length} испытаний</td></tr><tr><td>Мой фильтр</td><td>${state.built?state.built.layers.map(id=>esc(LAYERS.find(x=>x.id===id).name)).join(' → '):'Не собран'}</td></tr><tr><td>Правило безопасности</td><td><b>Внешний вид воды не подтверждает её безопасность для питья</b></td></tr></tbody></table><div class="note" style="margin-top:14px"><b>Вывод:</b> Отстаивание уменьшает часть взвеси; фильтрация задерживает частицы; адсорбция удерживает некоторые вещества на поверхности сорбента. Ни один школьный опыт сам по себе не подтверждает пригодность воды для питья.</div></div><div class="panel no-print"><h3>Выходной билет — 6 вопросов</h3><p class="sub">Отвечаем самостоятельно. Каждый правильный ответ — 1 балл.</p>${QUIZ.map((q,i)=>`<div class="quizq"><b>${i+1}. ${esc(q[0])}</b>${questionChoice('quiz',i,q[1],state.quiz[i],q[2],state.quizChecked)}</div>`).join('')}<div class="actions"><button class="primary" data-action="quiz-check">Проверить выходной билет</button><button class="secondary" data-action="print">Распечатать отчёт</button><button class="ghost" data-action="copy">Скопировать текст отчёта</button></div>${state.quizChecked?checkResult(n,6,'Сверьте объяснения и запишите одну мысль, которую сможете применить в жизни.')+`<div class="bonus" style="margin-top:12px"><b>Твоё звание:</b> ${rank}</div>`:''}<h4>Текст для переноса в тетрадь</h4><div class="copybox">${esc(reportText())}</div></div>`}

function render(){let done=Object.keys(state.done).length;let s=STAGES[state.stage];const say=anim.say||MASC[state.stage];const en=anim.enter?' enter':'';
 app.innerHTML=`<div class="shell"><aside class="side"><div class="identity"><div class="tag">ВИРТУАЛЬНЫЙ ПРАКТИКУМ · 6 КЛАСС</div><h1>Чистая вода?</h1><p>Отстаивание • фильтрация • адсорбция</p></div><div class="nav">${STAGES.map((r,i)=>`<button class="stepbtn ${state.stage===i?'active':''} ${state.done[i]?'done':''}" data-action="go" data-i="${i}" title="${esc(r[0])}"><span class="num">${state.done[i]?'✓':String(i+1).padStart(2,'0')}</span><span class="navtitle">${esc(r[0])}</span></button>`).join('')}</div><div class="sidehint"><strong>Памятка учителю</strong><p>10 станций на 40 минут. Один ученик нажимает на доске; остальные сначала выбирают ответ самостоятельно.</p><p>Анимации и индексы модели условные, не лабораторные данные.</p><button class="ghost" style="width:100%;font-size:12px;min-height:35px" data-action="teacher">${state.teacher?'Скрыть подсказки':'Подсказки учителю'}</button>${state.teacher?`<p>Базовый маршрут: 1–8 + итог 10. Станция 9 — резерв. Проверки раскрывают объяснения. Нажми на Капельку — она расскажет интересный факт.</p>`:''}</div></aside><main class="content"><div class="topline"><div class="kicker">ИССЛЕДОВАТЕЛЬСКАЯ СТАНЦИЯ ${state.stage+1} ИЗ ${STAGES.length}</div><div class="progresswrap"><span>Журнал: ${done}/${STAGES.length}</span><div class="track"><div class="fill" style="width:${done/STAGES.length*100}%"></div></div></div></div><section class="stagehead${en}"><div class="headtext"><div class="eyebrow">${esc(s[2])} · КЛАССНЫЙ ЭКСПЕРИМЕНТ</div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p></div><button class="mascot" data-action="mascot" aria-label="Капелька: нажми, чтобы узнать факт">${MASCOT_SVG}<div class="bubble" id="bubble">${esc(say)}</div></button></section><div class="board"><div class="workspace${en}" id="workspace">${renderStage(state.stage)}</div><div class="aside"><div class="panel"><h4>🔎 Научный маршрут</h4><div class="stat"><span>Пробы</span><b>${Object.keys(state.settleRecords).length}</b></div><div class="stat"><span>Фильтрация</span><b>${Object.keys(state.filterRecords).length}</b></div><div class="stat"><span>Адсорбция</span><b>${Object.keys(state.adsRecords).length}</b></div><div class="stat"><span>Своя модель</span><b>${state.built?'✓':'—'}</b></div><p class="mini">Результаты сохраняются до перезагрузки страницы.</p></div><div class="panel"><h4>⚠️ Важно</h4><p class="mini">Учебная симуляция. Прозрачная вода не обязательно питьевая. Никогда не пробуем воду после школьного фильтра.</p></div><div class="panel"><h4>Что делает весь класс?</h4><ol class="stepkeys"><li>Прогноз в тетради</li><li>Решение у доски</li><li>Наблюдение</li><li>Вывод своими словами</li></ol></div></div></div><div class="footer"><button class="secondary" data-action="prev" ${state.stage===0?'disabled':''}>← Назад</button><div class="actions" style="margin:0"><button class="ghost" data-action="full">⛶ Полный экран</button><button class="primary" data-action="next">${state.stage===9?'Вернуться к началу':'Следующая станция →'}</button></div></div><p class="shareline">Работает без интернета · большие кнопки для интерактивной доски · реальные образцы и измерения не используются</p></main></div>`;
 anim.enter=false;initSims()}
const jump=i=>{state.stage=Math.min(9,Math.max(0,i));anim.enter=true;anim.say='';anim.filterGo=false;anim.adsGo=false;anim.fairGo=false;anim.buildGo=false;render();window.scrollTo({top:0,behavior:'instant'})};
function handleClick(e){let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action;const id=b.dataset.id;const i=Number(b.dataset.i);const val=Number(b.dataset.val);switch(a){
case'go':jump(i);return;case'prev':jump(state.stage-1);return;case'next':jump(state.stage===9?0:state.stage+1);return;
case'full':{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen();return}
case'mascot':{const el=document.getElementById('bubble');if(el)el.textContent='💡 '+FACTS[Math.random()*FACTS.length|0];return}
case'teacher':state.teacher=!state.teacher;break;
case'sample':state.sample=id;anim.filterGo=false;break;
case'hyp':state.hyp=val;anim.say=val===1?'Верно! Проверим на опытах 🔬':'Хм… давай проверим опытом!';break;
case'record-hyp':if(state.hyp!==null){mark(0);if(state.hyp===1)anim.fx=true}else{alert('Сначала выбери гипотезу.');return}break;
case'sort':state.sort[id]=val;state.sorted=false;break;
case'sort-check':{let n=SORT.filter((s,j)=>state.sort[j]===['Отстаивание','Фильтрация','Адсорбция'].indexOf(s[1])).length;state.sorted=true;mark(1,n>=7);anim.say=sayN(n,9);if(n===9)anim.fx=true;break}
case'sort-reset':state.sort={};state.sorted=false;break;
case'settle-time':state.settle=val;syncSettle();return;
case'settle-play':state.settle=Math.min(20,state.settle+5);syncSettle();return;
case'settle-shake':state.settle=0;syncSettle();return;
case'settle-record':{let s=state.sample;state.settleRecords[s]={title:SAMPLES[s].title,time:state.settle,res:s==='mud'&&state.settle>0?'часть взвеси оседает':s==='mud'?'осадок пока почти не появился':'растворённые примеси не оседают'};mark(2,Object.keys(state.settleRecords).length>=2);break}
case'filter-material':state.filterMaterial=id;anim.filterGo=false;break;
case'filter-run':{let s=state.sample,m=state.filterMaterial,r=filtrationResult(s,m);state.filterRecords[s+m]={sample:SAMPLES[s].title,material:LAYERS.find(x=>x.id===m).name,result:r[0],assessment:r[1]};anim.filterGo=true;mark(3,Object.keys(state.filterRecords).length>=2);break}
case'ads-material':state.adsMaterial=id;anim.adsGo=false;break;case'ads-usage':state.adsUsage=id;anim.adsGo=false;break;
case'ads-run':{let c=state.adsMaterial==='charcoal',fresh=state.adsUsage==='fresh';let status=c?(fresh?'Часть примеси адсорбирована':'Ёмкость ограничена'):'Заметной адсорбции не ожидаем';let result=c?(fresh?'Некоторые молекулы органической примеси удерживаются на поверхности угля.':'После использования активные места частично заняты; эффект может уменьшиться.'):'Крупный гравий не служит эффективным сорбентом выбранной растворённой примеси.';state.adsRecords[state.adsMaterial+state.adsUsage]={name:(c?'Активированный уголь':'Гравий')+' · '+(fresh?'свежий':'использованный'),status,result};anim.adsGo=true;mark(4,Object.keys(state.adsRecords).length>=2);break}
case'add-layer':if(state.layers.length<6){state.layers.push(id);state.built=null;anim.buildGo=false}else alert('В модели можно использовать не более шести слоёв.');break;
case'remove-layer':state.layers.splice(Number(b.dataset.index),1);state.built=null;anim.buildGo=false;break;
case'move-layer':{let j=Number(b.dataset.index),k=j+Number(b.dataset.dir);if(k>=0&&k<state.layers.length){[state.layers[j],state.layers[k]]=[state.layers[k],state.layers[j]];state.built=null;anim.buildGo=false}break}
case'clear-layers':state.layers=[];state.built=null;anim.buildGo=false;break;
case'build-sample':state.buildSample=id;state.built=null;anim.buildGo=false;break;
case'run-build':{if(state.layers.length<3){alert('Добавь хотя бы три слоя и попробуй снова.');return}let x=evaluateBuild();let comment=(x.fine?'Мелкая взвесь может задерживаться. ':'Для мелкой взвеси не хватает подходящего слоя. ')+(x.carbon?'Уголь может уменьшить часть органических примесей. ':'Слоя активированного угля нет. ')+'Соли и микробная безопасность этой моделью не проверяются.';state.built={...x,layers:[...state.layers],sampleId:state.buildSample,sampleName:SAMPLES[state.buildSample].title,comment};anim.buildGo=true;anim.say='Смотри, как вода идёт через слои! 👀';mark(5);break}
case'fair-run':anim.fairGo=true;anim.say='Смотри на счётчики запаха!';break;
case'fair':state.fair[id]=val;state.fairChecked=false;break;
case'fair-check':{const n=FAIR.filter((q,j)=>state.fair[j]===q[2]).length;state.fairChecked=true;mark(6,n>=3);anim.say=sayN(n,4);if(n===4)anim.fx=true;break}
case'limit':state.limit[id]=val;state.limitsChecked=false;break;
case'limit-check':{const n=LIMITS.filter((q,j)=>state.limit[j]===limitCategories.indexOf(q[1])).length;state.limitsChecked=true;mark(7,n>=4);anim.say=sayN(n,6);if(n===6)anim.fx=true;break}
case'case':state.cases[id]=val;state.casesChecked=false;break;
case'case-check':{const n=CASES.filter((q,j)=>state.cases[j]===q.correct).length;state.casesChecked=true;mark(8,n>=3);anim.say=sayN(n,5);if(n===5)anim.fx=true;break}
case'quiz':state.quiz[id]=val;state.quizChecked=false;break;
case'quiz-check':{const n=QUIZ.filter((q,j)=>state.quiz[j]===q[2]).length;state.quizChecked=true;mark(9,Object.keys(state.quiz).length===QUIZ.length);anim.say=sayN(n,6);if(n===6)anim.fx=true;break}
case'copy':{let msg=reportText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(()=>alert('Текст скопирован.'),()=>prompt('Скопируй текст отчёта:',msg))}else prompt('Скопируй текст отчёта:',msg);return}
case'print':window.print();return;
}render();if(anim.fx){anim.fx=false;confetti()}}
app.addEventListener('click',handleClick);
app.addEventListener('input',e=>{if(e.target.dataset.action==='settle-slider'){state.settle=Number(e.target.value);syncSettle()}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&e.altKey){e.preventDefault();jump(state.stage+1)}if(e.key==='ArrowLeft'&&e.altKey){e.preventDefault();jump(state.stage-1)}});
render();
</script></body></html>
