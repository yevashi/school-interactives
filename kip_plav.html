<style>

['Все жидкости кипят при 100 °C.',1,'100 °C — только для воды при 1 атм.'],['Плавление — переход из твёрдого в жидкое.',0,'Это определение плавления.'],['Этанол закипит раньше воды.',0,'78 °C < 100 °C.'],['Испарение возможно ниже Tкип.',0,'Испарение идёт с поверхности.'],['При кипении пузырьки пара образуются по всему объёму.',0,'Это признак кипения.'],['Tкип не зависит от давления.',1,'Зависит от давления.'],['При −20 °C вода при 1 атм — газ.',1,'Это лёд.'],['Алюминий плавится при более высокой T, чем лёд.',0,'660 °C > 0 °C.']].map(([q,r,w])=>Q(q,['Верно','Неверно'],r,w))},
{n:'Финальный босс',ic:'🏆',t:'quiz',d:'Последняя проверка!',items:[
Q('Переход «газ → жидкость»?',['Кипение','Кристаллизация','Конденсация','Плавление'],2,'Это конденсация.'),

Q('Этанол при −130 °C (1 атм) —…',['Твёрдое','Жидкое','Газ','Плазма'],0,'−130 ниже −114 °C.'),
Q('У кого Tкип ниже?',['Вода','Этанол','Алюминий','Железо'],1,'Этанол: 78 °C.'),
Q('Какая пара процессов обратная?',['Плавление и кристаллизация','Плавление и кипение','Кипение и нагрев','Испарение и плавление'],0,'Твёрдое ↔ жидкое.'),
Q('Алюминий при 700 °C (1 атм)?',['Твёрдый','Жидкий','Газ','Лёд'],1,'660 < 700 < 2470 °C.'),
Q('Почему на плато температура постоянна?',['Энергия идёт на смену состояния','Нагрев выключен','Частицы исчезли','Вещество стало другим'],0,'Меняется состояние, не состав.'),
Q('Как найти состояние вещества?',['Сравнить T с Tпл и Tкип','Угадать','По цвету','По массе'],0,'Нужны оба порога.')]}
];
let cur=-1,S=[],res=null,pick=null,ord=[],bad=0;
const reset=()=>{S=M.map(()=>({i:0,h:0,done:false,sv:[]}));cur=-1;res=null};reset();
const total=()=>S.reduce((a,s)=>a+s.h,0),dn=()=>S.filter(s=>s.done).length;
function nav(){$('#nav').innerHTML=`<button class="nv ${cur<0?'on':''}" data-m="-1"><i>🏠</i>Главная</button>`+M.map((m,k)=>`<button class="nv ${cur===k?'on':''}" data-m="${k}"><i>${m.ic}</i>${E(m.n)}${S[k].done?'<span class="ok">✓</span>':''}</button>`).join('')}
function go(k){cur=k;res=null;pick=null;ord=[];bad=0;render(1);scrollTo(0,0)}
function frame(m,body){const n=m.items.length,i=S[cur].i;return `<div class="mh"><span class="tag">МИССИЯ ${cur+1} / ${M.length}</span><h1>${m.ic} ${E(m.n)}</h1><p>${E(m.d)}</p></div><div class="pbar"><span style="width:${100*i/n}%"></span></div><div>Задание ${Math.min(i+1,n)} из ${n}</div>${body}`}
const fb=(ok,w)=>`<div class="fb ${ok?'g':'b'}"><b>${ok?'✓ Верно!':'✗ Не совсем.'}</b> ${E(w)}</div>`;
const nxt=(en,last)=>`<div class="nx"><button class="btn ${en?'pl':''}" id="nx" ${en?'':'disabled'}>${last?'Завершить 🏁':'Дальше →'}</button></div>`;
function rQuiz(m){const it=m.items[S[cur].i],last=S[cur].i==m.items.length-1;
return frame(m,`<div class="card"><div class="q">${E(it.q)}</div>${it.vis||''}<div class="ans an ${m.five?'five':''}">${it.o.map((o,k)=>`<button class="a ${res?(k==it.r?'g':k==res.p?'b':'d'):''}" data-c="${k}" ${res?'disabled':''}>${E(o)}</button>`).join('')}</div>${res?fb(res.ok,it.w):''}${nxt(res,last)}</div>`)}
function rNum(m){const it=m.items[S[cur].i],last=S[cur].i==m.items.length-1;
return frame(m,`<div class="card"><div class="q">${E(it[0])}</div><div class="ni" id="nf"><input id="nv" type="text" inputmode="decimal" autocomplete="off" placeholder="Число" ${res?'disabled value="'+E(res.v)+'"':''}><button type="button" class="btn" id="ckn" ${res?'disabled':''}>Проверить</button></div>${res?fb(res.ok,it[2]):''}${nxt(res,last)}</div>`)}
function rOrd(m){const it=m.items[S[cur].i],last=S[cur].i==m.items.length-1;if(!ord.length)ord=[3,0,5,2,1,4];
return frame(m,`<div class="card"><div class="q">${E(it.q)}</div><div class="an">${ord.map((v,k)=>`<div class="od"><b>${k+1}</b><span>${E(it.s[v])}</span><button data-u="${k}" ${res||k==0?'disabled':''}>↑</button><button data-d="${k}" ${res||k==5?'disabled':''}>↓</button></div>`).join('')}</div>${bad&&!res?'<div class="fb b">Порядок пока неверный. Подумай ещё!</div>':''}${res?fb(1,'Порядок: нагрев → переход → нагрев → переход → нагрев.'):`<div class="nx"><button class="btn" id="ck">Проверить</button></div>`}${res?nxt(1,last):''}</div>`)}
function rMatch(m){const sv=S[cur].sv,rs=[5,2,7,0,4,6,1,3];
const b=(a,c)=>a.map(k=>`<button class="mi ${sv.includes(k)?'so':''} ${c&&pick===k?'sel':''}" data-k="${k}" ${sv.includes(k)?'disabled':''}>${E(m.items[k][c?0:1])}${sv.includes(k)?' ✓':''}</button>`).join('');
return frame(m,`<div class="card"><div class="mg an"><div id="lf">${b([0,1,2,3,4,5,6,7],1)}</div><div id="rt">${b(rs,0)}</div></div></div>`)}
function home(){return `<div class="hero"><span class="flo" style="right:6%;top:55%">🧊</span><span class="flo" style="right:15%;top:8%;animation-delay:.6s">🔥</span><span class="flo" style="right:24%;top:68%;animation-delay:1.2s">💧</span><span class="flo" style="right:33%;top:20%;animation-delay:1.8s">☁️</span><span class="tag">6 КЛАСС · 10 МИССИЙ</span><h1>ТЕРМО<span style="color:#fff4a8">ЛАБОРАТОРИЯ</span></h1><p>Плавление, кипение и состояния вещества. Сумеешь пройти все миссии вместе с Термиком?</p><button class="btn pl" id="st" style="margin-top:14px">Начать →</button></div><div class="card"><h2>🧠 Главное правило</h2><p style="font-size:19px;line-height:1.55">Сравни температуру с <b>Tпл</b> и <b>Tкип</b>: ниже Tпл — твёрдое, между ними — жидкое, выше Tкип — газ.</p></div><div class="card"><h2>📋 Справочник (1 атм)</h2>${tbl()}</div>`}
const tbl=()=>`<table><tr><th>Вещество</th><th>Tпл, °C</th><th>Tкип, °C</th></tr>${Object.values(SUB).map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td></tr>`).join('')}</table>`;
function end(m){return `<div class="card end"><span class="tr">${cur==9?'🏆':'🎉'}</span><h2>${E(m.n)}: готово!</h2><p style="font-size:20px">Баллов за миссию: <b>${S[cur].h}</b> из ${m.items.length}. Всего: ★ ${total()}</p><button class="btn pl" id="ct">${dn()==M.length?'На главную':'Следующая миссия →'}</button></div>`}
function render(fresh){nav();$('#score').textContent='★ '+total();const m=M[cur];
 $('#main').className=fresh?'enter':'';
 $('#main').innerHTML=cur<0?home():S[cur].done?end(m):({quiz:rQuiz,num:rNum,ord:rOrd,match:rMatch})[m.t](m);
 if(fresh&&cur>=0&&S[cur].done){say('Миссия пройдена! 🏆','happy');boom(120)}bind()}
function score(ok){if(ok)S[cur].h++;const sc=$('#score');sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop')}
function react(ok){if(ok){say(R(['Супер! 🎉','Точно! ⭐','Молодец!','Класс! 🔥','Верно! 👏']),'happy');boom(26)}else say(R(['Ничего, подумай ещё!','Почти! Давай разберём','Ошибки учат! 💡']),'sad')}
function adv(){const s=S[cur];s.i++;res=null;ord=[];bad=0;if(s.i>=M[cur].items.length)s.done=true;render(1);scrollTo(0,0)}
function bind(){const m=M[cur];
 $('#st')&&($('#st').onclick=()=>go(0));$('#ct')&&($('#ct').onclick=()=>go(dn()==M.length?-1:S.findIndex(s=>!s.done)));
 $('#nx')&&($('#nx').onclick=adv);
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go(+b.dataset.m));
 if(!m||S[cur].done)return;
 if(m.t=='quiz')document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(res)return;const p=+b.dataset.c,ok=p==m.items[S[cur].i].r;res={ok,p};score(ok);render();react(ok)});
 if(m.t=='num'){const chk=()=>{if(res)return;const raw=$('#nv').value.replace(/[\s\u00a0]/g,'').replace(',','.').replace(/[−–—]/g,'-'),n=Number(raw);if(raw===''||isNaN(n)){say('Введи число, например 100','sad');$('#nv').focus();return}const ok=Math.abs(n-m.items[S[cur].i][1])<.01;res={ok,v:raw};score(ok);render();react(ok)};$('#ckn').onclick=chk;$('#nv').onkeydown=e=>{if(e.key==='Enter')chk()};if(!res)$('#nv').focus()}
 if(m.t=='ord'){document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=+b.dataset.u;[ord[k-1],ord[k]]=[ord[k],ord[k-1]];bad=0;render()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=+b.dataset.d;[ord[k+1],ord[k]]=[ord[k],ord[k+1]];bad=0;render()});
  const c=$('#ck');c&&(c.onclick=()=>{const ok=ord.every((x,k)=>x==k);if(ok){res={ok:1};score(!bad);render();react(1)}else{bad=1;render();react(0)}})}
 if(m.t=='match'){document.querySelectorAll('#lf [data-k]').forEach(b=>b.onclick=()=>{pick=+b.dataset.k;document.querySelectorAll('#lf [data-k]').forEach(x=>x.classList.toggle('sel',+x.dataset.k==pick))});
  document.querySelectorAll('#rt [data-k]').forEach(b=>b.onclick=()=>{if(pick===null){say('Сначала выбери понятие слева','sad');return}
   if(+b.dataset.k==pick){const s=S[cur];s.sv.push(pick);s.h++;s.i=s.sv.length;pick=null;if(s.i>=m.items.length)s.done=true;render(s.done);react(1)}
   else{b.classList.add('wr');setTimeout(()=>b.classList.remove('wr'),500);react(0)}})}}
const fx=document.createElement('div');fx.className='fx';
['❄️','💧','☁️','🔥','🧊','✨','🌡️','💦'].forEach(e=>{for(let k=0;k<2;k++){const s=document.createElement('span');s.textContent=e;s.style.cssText=`left:${Math.random()*100}%;font-size:${20+Math.random()*26}px;animation-duration:${12+Math.random()*14}s;animation-delay:${-Math.random()*20}s;--dx:${Math.random()*160-80}px`;fx.appendChild(s)}});
document.body.prepend(fx);
const mc=document.createElement('div');mc.id='mascot';
mc.innerHTML='<div id="bub"></div><svg viewBox="0 0 100 140"><rect x="38" y="6" width="24" height="96" rx="12" fill="#fff" stroke="#bfe0ff" stroke-width="3"/><rect x="45" y="44" width="10" height="60" rx="5" fill="#ff4d6d"/><circle cx="50" cy="106" r="28" fill="#ff4d6d" stroke="#fff" stroke-width="3"/><circle cx="41" cy="102" r="6" fill="#fff"/><circle cx="59" cy="102" r="6" fill="#fff"/><circle cx="42" cy="103" r="3" fill="#222"/><circle cx="60" cy="103" r="3" fill="#222"/><circle cx="34" cy="112" r="4" fill="#ff9ab0"/><circle cx="66" cy="112" r="4" fill="#ff9ab0"/><path class="m1" d="M42 115q8 7 16 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path class="m2" d="M40 113q10 14 20 0z" fill="#7a1030"/><path class="m3" d="M42 121q8-7 16 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
document.body.appendChild(mc);
let bt,mt;
function say(t,mood){$('#bub').textContent=t;mc.className='say'+(mood?' '+mood:'');clearTimeout(bt);clearTimeout(mt);mt=setTimeout(()=>mc.classList.remove('happy','sad'),900);bt=setTimeout(()=>mc.classList.remove('say'),2800)}
function boom(n){const c=['#ff6fae','#ffe56f','#5fd9f2','#60e1b7','#a78bfa','#ff9f43'];for(let i=0;i<n;i++){const s=document.createElement('i');s.className='cf';const w=6+Math.random()*9;s.style.cssText=`left:${Math.random()*100}vw;width:${w}px;height:${w*1.6}px;background:${R(c)};border-radius:2px;animation-duration:${2+Math.random()*2.2}s;animation-delay:${Math.random()*.5}s;--dx:${Math.random()*200-100}px;--r:${Math.random()*900}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}
$('#tbl').onclick=()=>{$('#mb').innerHTML=tbl();$('#ov').classList.add('open')};
$('#cl').onclick=()=>$('#ov').classList.remove('open');
$('#ov').onclick=e=>{if(e.target.id=='ov')$('#ov').classList.remove('open')};
$('#rst').onclick=()=>{if(confirm('Начать всё заново?')){reset();render(1)}};
$('#full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}};
render(1);setTimeout(()=>say('Привет! Я Термик 🌡️','happy'),600);
</script></body></html>
